<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Punto de Venta</title>
<style>
  * { box-sizing: border-box; -webkit-box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f2f4f7; color: #1c2733; font-size: 17px;
  }
  header {
    background: #123a5e; color: #fff; padding: 10px 14px;
  }
  header .marca { font-weight: bold; font-size: 19px; display: inline-block; margin: 4px 8px 4px 0; }
  header a {
    color: #d7e6f5; text-decoration: none; padding: 9px 14px;
    border-radius: 10px; font-size: 16px; display: inline-block; margin: 3px 2px;
  }
  header a.activo, header a:active { background: #1d5c93; color: #fff; }
  main { padding: 12px; max-width: 900px; margin: 0 auto; }
  .flash {
    background: #e6f4e6; border: 1px solid #9fd39f; color: #1c5c22;
    padding: 10px 14px; border-radius: 10px; margin: 10px 0;
  }
  .aviso {
    background: #fdecea; border: 1px solid #f2b8b5; color: #8a1f16;
    padding: 10px 14px; border-radius: 10px; margin: 10px 0;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); margin-bottom: 12px;
  }
  input, select, textarea {
    width: 100%; padding: 12px; font-size: 17px; border: 1.5px solid #c4cfdb;
    border-radius: 10px; background: #fff; margin: 4px 0 12px;
  }
  input:focus, select:focus { outline: none; border-color: #1d5c93; }
  label { font-size: 14px; color: #4a5b6b; font-weight: 600; }
  button, .btn {
    display: inline-block; border: 0; border-radius: 12px; padding: 14px 18px;
    font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none;
    color: #fff; background: #1d5c93; text-align: center;
  }
  button:active { -webkit-transform: scale(.97); transform: scale(.97); }
  .btn-verde { background: #1e8e3e; }
  .btn-rojo { background: #c5221f; }
  .btn-gris { background: #5f6b7a; }
  .btn-naranja { background: #e8710a; }
  .btn-peque { padding: 8px 12px; font-size: 14px; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid #e4e9ef; }
  th { color: #4a5b6b; font-size: 13px; text-transform: uppercase; }
  .fila-click:active { background: #eef4fa; }
  .stock-bajo { color: #c5221f; font-weight: 700; }
  .thumb {
    width: 54px; height: 54px; border-radius: 10px;
    background: #dde4ec; vertical-align: middle;
  }
  img.thumb { object-fit: cover; -o-object-fit: cover; }
  .grande { font-size: 26px; font-weight: 800; }
  .muted { color: #6b7a8a; font-size: 14px; }
  .grid2 { margin: 0 -5px; }
  .grid2 > div { display: inline-block; width: 49%; vertical-align: top; padding: 0 5px; }
  .acciones { margin: 0 -4px; }
  .acciones > * { display: inline-block; margin: 0 4px 8px 4px; }
  button { white-space: normal; }
</style>
</head>
<body>
<header>
  <span class="marca">Punto de Venta</span>
  <a href="{{ url_for('venta') }}" class="{{ 'activo' if request.path == '/venta' else '' }}">Venta</a>
  <a href="{{ url_for('productos') }}" class="{{ 'activo' if request.path.startswith('/productos') else '' }}">Productos</a>
  <a href="{{ url_for('facturas') }}" class="{{ 'activo' if request.path.startswith('/facturas') else '' }}">Facturas</a>
  <a href="{{ url_for('config') }}" class="{{ 'activo' if request.path == '/config' else '' }}">Config</a>
</header>
<main>
  {% with mensajes = get_flashed_messages() %}
    {% for m in mensajes %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
