{% extends "base.html" %}
{% block contenido %}

<div class="card">
  <h2 style="margin-top:0">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h2>
  <form method="post" enctype="multipart/form-data">
    <label>Nombre *</label>
    <input name="nombre" value="{{ producto.nombre if producto else '' }}" required>

    <label>Codigo de barras / codigo interno</label>
    <input name="codigo" id="codigo" value="{{ producto.codigo if producto and producto.codigo else '' }}"
           placeholder="Escanee con el laser o escriba" autocomplete="off">

    <div class="grid2">
      <div>
        <label>Categoria</label>
        <select name="categoria">
          <option value="">— sin categoria —</option>
          {% for c in cats %}
            <option value="{{ c }}" {{ 'selected' if producto and producto.categoria == c }}>{{ c }}</option>
          {% endfor %}
          {% if producto and producto.categoria and producto.categoria not in cats %}
            <option value="{{ producto.categoria }}" selected>{{ producto.categoria }}</option>
          {% endif %}
        </select>
      </div>
      <div>
        <label>Ratio de moneda</label>
        <select name="ratio_id" id="ratio_id">
          {% for r in ratios %}
            <option value="{{ r.id }}"
              {{ 'selected' if (producto and producto.ratio_id == r.id) or (not producto and defecto and defecto.id == r.id) }}>
              {{ r.nombre }} (costo x {{ r.valor }})
            </option>
          {% endfor %}
        </select>
      </div>
    </div>
    <p class="muted">
      ¿Falta una categoria o un ratio?
      <a href="{{ url_for('categorias') }}">Administrar categorias</a> ·
      <a href="{{ url_for('ratios') }}">Administrar ratios</a>
    </p>

    <div class="grid2">
      <div>
        <label>Costo</label>
        <input name="costo" id="costo" inputmode="decimal"
               value="{{ ('%.2f'|format(producto.costo))|replace('.', ',') if producto else '' }}"
               placeholder="0,00">
      </div>
      <div>
        <label>Precio de venta</label>
        <input name="precio" id="precio" inputmode="decimal"
               value="{{ ('%.2f'|format(producto.precio))|replace('.', ',') if producto and producto.precio else '' }}"
               placeholder="auto: costo x ratio">
      </div>
    </div>
    <p class="muted" id="sugerido"></p>

    <div class="grid2">
      <div>
        <label>Stock actual</label>
        <input name="stock" inputmode="decimal"
               value="{{ producto.stock|round(1) if producto else '0' }}">
      </div>
      <div>
        <label>Stock minimo (aviso)</label>
        <input name="stock_min" inputmode="decimal"
               value="{{ producto.stock_min|round(1) if producto else '0' }}">
      </div>
    </div>

    <label>Foto del producto (se comprime automaticamente)</label>
    <input type="file" name="foto" accept="image/*" capture="environment">
    {% if producto and producto.foto %}
      <img class="thumb" style="width:110px;height:110px"
           src="{{ url_for('foto', nombre=producto.foto) }}" alt="">
    {% endif %}

    <div class="acciones">
      <button class="btn btn-verde" type="submit">Guardar</button>
      <a class="btn btn-gris" href="{{ url_for('productos') }}">Cancelar</a>
      {% if producto %}
        <button class="btn btn-rojo" type="submit"
                formaction="{{ url_for('producto_eliminar', pid=producto.id) }}"
                onclick="return confirm('¿Eliminar este producto?')">Eliminar</button>
      {% endif %}
    </div>
  </form>
</div>

<script>
var RATIOS = {{ ratios|tojson|safe }};
var costo = document.getElementById('costo');
var precio = document.getElementById('precio');
var selRatio = document.getElementById('ratio_id');
var sugerido = document.getElementById('sugerido');

function numval(s) {
  if (!s) return NaN;
  s = s.trim().replace(/\./g, '').replace(',', '.');
  return parseFloat(s);
}

function valorRatio() {
  var i, r;
  for (i = 0; i < RATIOS.length; i++) {
    r = RATIOS[i];
    if (String(r.id) === selRatio.value) return r.valor;
  }
  return 1.3;
}

function actualizarSugerido() {
  var c = numval(costo.value);
  var v = valorRatio();
  if (isNaN(c)) { sugerido.textContent = ''; return; }
  var s = (c * v).toFixed(2).replace('.', ',');
  sugerido.textContent = 'Precio sugerido: costo ' + c + ' x ' + v + ' = $ ' + s;
  if (!precio.value.trim()) precio.value = s;
}

costo.addEventListener('input', actualizarSugerido, false);
costo.addEventListener('keyup', actualizarSugerido, false);
selRatio.addEventListener('change', actualizarSugerido, false);
actualizarSugerido();

// el escaner laser teclea el codigo + Enter: lo dejamos en el campo
document.getElementById('codigo').addEventListener('keydown', function(e) {
  e = e || window.event;
  var tecla = e.key || e.keyCode;
  if (tecla === 'Enter' || tecla === 13) {
    if (e.preventDefault) e.preventDefault();
    return false;
  }
}, false);
</script>
{% endblock %}
